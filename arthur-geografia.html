<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07150e"><title>Geografia do Arthur</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#07150e;color:#fff}body{padding:8px}.app{max-width:520px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0 8px}.brand{font-size:20px;font-weight:1000}.pill{background:#ffffff18;border:1px solid #ffffff28;border-radius:999px;padding:8px 11px;font-weight:900}.bar{height:10px;background:#ffffff22;border-radius:999px;overflow:hidden;margin-bottom:8px}.bar i{display:block;height:100%;width:0;background:#ffd84a;transition:.25s}.field{position:relative;min-height:calc(100dvh - 82px);border:3px solid #ffffffdd;border-radius:22px;overflow:hidden;background:repeating-linear-gradient(90deg,#11823b 0 58px,#0d6f33 58px 116px)}.field:before{content:"";position:absolute;inset:18px;border:2px solid #ffffffaa;border-radius:8px;pointer-events:none}.stage{position:relative;z-index:2;padding:12px;min-height:calc(100dvh - 88px);display:flex;align-items:center;justify-content:center}.card{width:100%;background:#fffffff7;color:#14231a;border-radius:20px;padding:17px;box-shadow:0 12px 30px #0005}h1,h2,p{margin-top:0}h1{font-size:34px;line-height:.95;margin-bottom:11px}h2{font-size:25px;line-height:1.08;margin-bottom:10px}.sub{font-size:17px;line-height:1.35;color:#496052}.coach{background:#eef7f1;border:2px solid #d9eadf;border-radius:15px;padding:11px 12px;font-size:16px;font-weight:850;line-height:1.33;margin-bottom:11px}.btn{width:100%;border:0;border-radius:15px;padding:14px 12px;font-size:17px;font-weight:950;cursor:pointer;touch-action:manipulation}.primary{background:#ffd84a;color:#302600}.game{background:#1769ff;color:#fff}.secondary{background:#e8f1eb;color:#173020}.choices{display:grid;gap:9px;margin-top:10px}.choice{background:#f2f7f4;border:2px solid #d7e6dc;color:#173020;min-height:56px}.feedback{display:none;margin-top:10px;padding:11px;border-radius:13px;font-weight:900}.feedback.show{display:block}.ok{background:#dcfce7;color:#14532d}.no{background:#fee2e2;color:#7f1d1d}.big{font-size:58px;text-align:center;margin:5px 0}.note{background:#fff6d0;border-left:5px solid #ffd84a;padding:10px;border-radius:12px;font-weight:850}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mini{background:#f3f8f5;border:2px solid #dce9df;border-radius:14px;padding:11px;text-align:center;font-weight:900}.sunbox{height:170px;border-radius:16px;position:relative;overflow:hidden;background:linear-gradient(#8bdcff 0 58%,#f7c65f 59%,#52aa59 60%);border:2px solid #d7e6dc}.sun{position:absolute;top:35px;left:50%;transform:translateX(-50%);font-size:62px}.side{position:absolute;bottom:8px;background:#fff;border-radius:11px;padding:8px 12px;font-weight:1000}.left{left:8px}.right{right:8px}.compass{width:230px;height:230px;margin:6px auto;border-radius:50%;background:#fff;border:8px solid #e0ebe3;position:relative}.dirbtn{position:absolute;border:0;border-radius:11px;background:#edf7f0;font-weight:1000;color:#173020;width:72px;height:46px}.north{top:8px;left:71px}.south{bottom:8px;left:71px}.west{left:8px;top:84px}.east{right:8px;top:84px}.player{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:48px;pointer-events:none}.goal{height:215px;position:relative;border-radius:16px;background:linear-gradient(#84d7ff 0 48%,#56a85b 49%);overflow:hidden;margin:8px 0}.net{position:absolute;left:7%;right:7%;top:28px;height:120px;border:5px solid #fff;border-bottom-width:8px;background:repeating-linear-gradient(0deg,#ffffff33 0 2px,transparent 2px 23px),repeating-linear-gradient(90deg,#ffffff33 0 2px,transparent 2px 36px)}.keeper{position:absolute;top:76px;left:50%;transform:translateX(-50%);font-size:52px;transition:.35s}.ball{position:absolute;bottom:17px;left:50%;transform:translateX(-50%);font-size:42px;transition:.45s}.ball.leftKick{bottom:116px;left:24%;transform:translateX(-50%) scale(.7)}.ball.centerKick{bottom:116px;left:50%;transform:translateX(-50%) scale(.7)}.ball.rightKick{bottom:116px;left:76%;transform:translateX(-50%) scale(.7)}.keeper.leftDive{left:24%;transform:translateX(-50%) rotate(-22deg)}.keeper.rightDive{left:76%;transform:translateX(-50%) rotate(22deg)}.penaltyAnswers{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.penaltyAnswers button{font-size:14px;min-height:72px;padding:9px 6px}.hud{display:flex;justify-content:space-between;gap:6px;font-size:14px;font-weight:900;margin-bottom:8px}.hud span{background:#eef7f1;border-radius:999px;padding:7px 9px}.flash{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;font-size:52px;font-weight:1000;text-align:center;text-shadow:0 6px 24px #0009}.flash.go{animation:pop .75s ease}@keyframes pop{0%{opacity:0;transform:scale(.5)}35%{opacity:1;transform:scale(1.07)}100%{opacity:0;transform:scale(1)}}.scoreBig{font-size:72px;font-weight:1000;text-align:center;color:#0d7837;line-height:1}@media(max-height:700px){.stage{align-items:flex-start}.field,.stage{min-height:auto}.goal{height:185px}.net{height:100px}.keeper{top:62px}.ball{bottom:9px}}</style></head><body><div class="app"><div class="top"><div class="brand">⚽ Geografia do Arthur</div><div class="pill" id="score">⭐ 0</div></div><div class="bar"><i id="bar"></i></div><div class="field"><div class="flash" id="flash"></div><main class="stage" id="stage"></main></div></div><script>const stage=document.getElementById('stage'),bar=document.getElementById('bar'),scoreEl=document.getElementById('score'),flash=document.getElementById('flash');let points=0,gameIndex=0,gameQuestions=[];const Q=[{q:'NASCENTE quer dizer que o Sol...',a:['nasce','se põe','some'],c:0,e:'Nascente = onde o Sol nasce.'},{q:'Nascente corresponde ao...',a:['Oeste','Leste','Sul'],c:1,e:'Nascente = Leste.'},{q:'POENTE quer dizer que o Sol...',a:['nasce','se põe','fica parado'],c:1,e:'Poente = onde o Sol se põe.'},{q:'Poente corresponde ao...',a:['Oeste','Leste','Norte'],c:0,e:'Poente = Oeste.'},{q:'Quais são os quatro pontos cardeais?',a:['Norte, Sul, Leste e Oeste','Frente, trás, direita e esquerda','Cima, baixo, leste e oeste'],c:0,e:'Norte, Sul, Leste e Oeste.'},{q:'Qual instrumento ajuda a descobrir direções?',a:['Régua','Bússola','Termômetro'],c:1,e:'A bússola ajuda na orientação.'},{q:'Cristiano olha uma casa bem DE FRENTE. É visão...',a:['Frontal','Vertical','Oblíqua'],c:0,e:'De frente = frontal.'},{q:'Neymar olha o campo RETO DE CIMA. É visão...',a:['Lateral','Vertical/superior','Frontal'],c:1,e:'Reto de cima = vertical/superior.'},{q:'Arthur olha de cima e inclinado, vendo teto e lado. É visão...',a:['Oblíqua','Frontal','Vertical'],c:0,e:'De cima e inclinado = oblíqua.'},{q:'A legenda de um mapa serve para...',a:['explicar símbolos','mostrar temperatura','contar gols'],c:0,e:'A legenda explica símbolos, cores e números.'},{q:'A padaria perto de casa ajuda alguém a localizar a casa. Ela é...',a:['ponto cardeal','ponto de referência','legenda'],c:1,e:'Lugar conhecido que ajuda a localizar outro = ponto de referência.'},{q:'Siga reto e vire à direita descreve...',a:['um percurso','uma legenda','uma visão'],c:0,e:'Isso descreve um caminho, ou percurso.'},{q:'CEP significa...',a:['Código de Endereçamento Postal','Cartão Especial de Pessoas','Código Escolar Postal'],c:0,e:'CEP = Código de Endereçamento Postal.'},{q:'Paisagem é...',a:['só natureza','tudo que observamos num espaço','só casas'],c:1,e:'Paisagem é tudo que podemos observar em um espaço.'}];function pop(t){flash.textContent=t;flash.className='flash';void flash.offsetWidth;flash.classList.add('go')}function home(){bar.style.width='0';scoreEl.textContent='⭐ 0';stage.innerHTML='<section class="card" style="text-align:center"><div class="big">🧤⚽🧭</div><h1>Copa da Geografia</h1><p class="sub">Primeiro dá pra <b>aprender fazendo</b>. Depois tem o <b>jogo de pênaltis</b> de verdade.</p><div class="choices"><button class="btn primary" onclick="startTraining()">📚 TREINAR E APRENDER</button><button class="btn game" onclick="startPenaltyGame()">⚽ JOGAR PÊNALTIS</button></div></section>'}function startTraining(){trainSun(0)}function trainSun(i){bar.style.width='12%';const d=[['O Sol está começando o dia. Ele está NASCENDO. Qual palavra combina?',['NASCENTE','POENTE'],0],['Agora o dia está terminando. O Sol está SE PONDO. Qual palavra combina?',['NASCENTE','POENTE'],1],['Agora liga com a direção: NASCENTE fica no...',['LESTE','OESTE'],0],['E o POENTE fica no...',['LESTE','OESTE'],1]][i];stage.innerHTML='<section class="card"><div class="coach">🌞 '+d[0]+'</div><div class="sunbox"><div class="sun">'+(i%2?'🌇':'🌞')+'</div><b class="side left">LESTE</b><b class="side right">OESTE</b></div><div class="choices">'+d[1].map((x,j)=>'<button class="btn choice" onclick="chooseSun('+i+','+j+')">'+x+'</button>').join('')+'</div><div id="fb" class="feedback"></div></section>'}function chooseSun(i,j){const correct=[0,1,0,1][i],msg=['Nascente vem de NASCER.','Poente é quando o Sol SE PÕE.','Nascente = Leste.','Poente = Oeste.'][i],fb=document.getElementById('fb');if(j===correct){pop('ACERTOU! ⚽');fb.className='feedback show ok';fb.textContent=msg;setTimeout(()=>i<3?trainSun(i+1):trainCompass(),650)}else{fb.className='feedback show no';fb.innerHTML='Pensa na ação: <b>nascer → nascente</b> e <b>se pôr → poente</b>. Tenta de novo.'}}function trainCompass(){bar.style.width='30%';stage.innerHTML='<section class="card"><div class="coach">🧭 Arthur está no meio do campo. Toque nas direções que o técnico pedir.</div><div class="compass"><button class="dirbtn north" onclick="chooseDirection(\'N\')">NORTE</button><button class="dirbtn south" onclick="chooseDirection(\'S\')">SUL</button><button class="dirbtn west" onclick="chooseDirection(\'O\')">OESTE</button><button class="dirbtn east" onclick="chooseDirection(\'L\')">LESTE</button><div class="player">🧤</div></div><h2 id="directionPrompt" style="text-align:center"></h2><div id="fb" class="feedback"></div></section>';window.directionSequence=['N','L','O','S'];window.directionIndex=0;updateDirectionPrompt()}function updateDirectionPrompt(){const names={N:'NORTE',S:'SUL',L:'LESTE',O:'OESTE'};document.getElementById('directionPrompt').textContent='TOQUE EM: '+names[window.directionSequence[window.directionIndex]]}function chooseDirection(x){const fb=document.getElementById('fb');if(x===window.directionSequence[window.directionIndex]){pop('DEFENDEU! 🧤');window.directionIndex++;if(window.directionIndex===4)setTimeout(trainViews,600);else setTimeout(updateDirectionPrompt,300)}else{fb.className='feedback show no';fb.textContent='Quase. Procura a direção pedida.'}}function trainViews(){bar.style.width='48%';stage.innerHTML='<section class="card"><div class="coach">👀 Agora o segredo é a posição do olhar.</div><div class="grid2"><div class="mini">👀🏠<br><b>FRONTAL</b><br>de frente</div><div class="mini">➡️🏠<br><b>LATERAL</b><br>de lado</div><div class="mini">⬇️🏠<br><b>VERTICAL</b><br>reto de cima</div><div class="mini">↘️🏠<br><b>OBLÍQUA</b><br>de cima e inclinada</div></div><div class="note" style="margin-top:10px">Vertical = só de cima. Oblíqua = de cima <b>e</b> de lado.</div><button class="btn primary" style="margin-top:10px" onclick="trainMap()">PRÓXIMA MISSÃO 🗺️</button></section>'}function trainMap(){bar.style.width='65%';stage.innerHTML='<section class="card"><div class="coach">🗺️ No mapa, a LEGENDA funciona como um tradutor: explica símbolos, cores e números.</div><div class="grid2"><div class="mini">🏠 = casa</div><div class="mini">🏫 = escola</div><div class="mini">🥖 = padaria</div><div class="mini">🏟️ = estádio</div></div><div class="coach" style="margin-top:10px">📍 Se eu digo “minha casa fica ao lado da padaria”, a padaria é um <b>ponto de referência</b>.</div><div class="note">↪️ “Siga reto, vire à direita” = <b>percurso</b>.<br>📮 CEP = Código de Endereçamento Postal.</div><div class="choices"><button class="btn game" onclick="startPenaltyGame()">AGORA JOGAR PÊNALTIS ⚽</button><button class="btn secondary" onclick="home()">MENU</button></div></section>'}function startPenaltyGame(){points=0;gameIndex=0;scoreEl.textContent='⭐ 0';gameQuestions=[...Q].sort(()=>Math.random()-.5).slice(0,12);renderPenalty()}function renderPenalty(){bar.style.width=(gameIndex/gameQuestions.length*100)+'%';const q=gameQuestions[gameIndex];stage.innerHTML='<section class="card"><div class="hud"><span>⚽ Pênalti '+(gameIndex+1)+'/'+gameQuestions.length+'</span><span>🏆 '+points+' gols</span></div><h2>'+q.q+'</h2><div class="goal"><div class="net"></div><div class="keeper" id="keeper">🧤</div><div class="ball" id="ball">⚽</div></div><div class="penaltyAnswers">'+q.a.map((x,i)=>'<button class="btn choice" onclick="shootPenalty('+i+')">'+x+'</button>').join('')+'</div><div id="fb" class="feedback"></div></section>'}function shootPenalty(i){document.querySelectorAll('.penaltyAnswers button').forEach(b=>b.disabled=true);const q=gameQuestions[gameIndex],ball=document.getElementById('ball'),keeper=document.getElementById('keeper'),fb=document.getElementById('fb'),kick=['leftKick','centerKick','rightKick'][i]||'centerKick';ball.classList.add(kick);if(i===q.c){points++;scoreEl.textContent='⭐ '+points;keeper.classList.add(i===0?'rightDive':'leftDive');setTimeout(()=>pop('GOOOOL! ⚽'),220);fb.className='feedback show ok';fb.textContent=q.e}else{keeper.classList.add(i===0?'leftDive':i===2?'rightDive':'leftDive');setTimeout(()=>pop('DEFESA! 🧤'),220);fb.className='feedback show no';fb.textContent='Aprende essa: '+q.e}setTimeout(()=>{gameIndex++;gameIndex>=gameQuestions.length?finishGame():renderPenalty()},1250)}function finishGame(){bar.style.width='100%';const title=points>=10?'CAMPEÃO! 🏆':points>=8?'MANDOU BEM! ⚽':'REVANCHE! 🔥';stage.innerHTML='<section class="card" style="text-align:center"><div class="big">🏆</div><h1>'+title+'</h1><div class="scoreBig">'+points+'/'+gameQuestions.length+'</div><div class="note" style="text-align:left;margin:12px 0">🌞 Nascente = Leste = Sol nasce<br>🌇 Poente = Oeste = Sol se põe<br>🧭 Norte, Sul, Leste e Oeste<br>👀 Frontal / lateral / vertical / oblíqua<br>🗺️ Legenda + ponto de referência + percurso</div><div class="choices"><button class="btn game" onclick="startPenaltyGame()">⚽ JOGAR DE NOVO</button><button class="btn primary" onclick="startTraining()">📚 REVER TREINO</button><button class="btn secondary" onclick="home()">MENU</button></div></section>'}home();</script></body></html>
