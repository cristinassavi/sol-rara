<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b5e2d">
<title>Geografia do Arthur</title>
<style>
:root{--g:#0f7a39;--g2:#0b5e2d;--y:#ffd84a;--ink:#14231a;--soft:#eef7f1;--ok:#dcfce7;--bad:#fee2e2}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;min-height:100%;background:#07150e;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}body{padding:max(8px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom));color:#fff}.app{width:100%;max-width:520px;margin:0 auto}.top{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px}.title{font-size:20px;font-weight:1000;line-height:1}.pill{font-size:13px;font-weight:900;background:#ffffff18;border:1px solid #ffffff22;padding:8px 10px;border-radius:999px}.progress{height:10px;background:#ffffff22;border-radius:999px;overflow:hidden;margin-bottom:8px}.progress>div{height:100%;background:var(--y);width:0;transition:.25s}.field{width:100%;min-height:calc(100dvh - 90px);background:repeating-linear-gradient(90deg,#11823b 0 56px,#0d6f33 56px 112px);border:3px solid #ffffffdd;border-radius:22px;position:relative;overflow:hidden}.field:before{content:"";position:absolute;inset:18px;border:2px solid #ffffffaa;border-radius:7px}.stage{position:relative;z-index:2;padding:12px;min-height:calc(100dvh - 96px);display:flex;align-items:center;justify-content:center}.card{width:100%;background:#fffffff7;color:var(--ink);border-radius:20px;padding:16px;box-shadow:0 10px 28px #0005}h1,h2,p{margin-top:0}h1{font-size:34px;line-height:.98;margin-bottom:10px}h2{font-size:26px;line-height:1.08;margin-bottom:10px}.sub{font-size:17px;line-height:1.35;color:#43594c}.coach{background:#edf7f0;border:2px solid #dbece0;border-radius:16px;padding:12px;margin-bottom:12px;font-size:17px;font-weight:850;line-height:1.35}.btn{width:100%;border:0;border-radius:15px;padding:15px 14px;font-size:17px;font-weight:950;cursor:pointer;touch-action:manipulation}.primary{background:var(--y);color:#302600}.secondary{background:#e8f1eb;color:#173020}.choices{display:grid;grid-template-columns:1fr;gap:9px;margin-top:12px}.choice{background:#f2f7f4;border:2px solid #d7e6dc;color:#173020;min-height:58px}.feedback{display:none;margin-top:10px;padding:11px 12px;border-radius:13px;font-size:15px;font-weight:900}.feedback.show{display:block}.ok{background:var(--ok);color:#14532d}.no{background:var(--bad);color:#7f1d1d}.big{font-size:54px;text-align:center;margin:6px 0}.sunbox{height:185px;border-radius:16px;overflow:hidden;position:relative;background:linear-gradient(#88d8ff 0 58%,#f8c65b 59%,#54a95b 60% 100%);border:2px solid #d5e5d9}.sun{position:absolute;top:45px;left:50%;transform:translateX(-50%);font-size:58px}.labelLR{position:absolute;bottom:8px;background:#fff;border-radius:12px;padding:9px 12px;font-weight:1000;font-size:16px;color:#173020}.labelLR.left{left:8px}.labelLR.right{right:8px}.compass{width:235px;height:235px;margin:8px auto;border-radius:50%;background:#fff;border:8px solid #e2ede5;position:relative}.dir{position:absolute;border:0;border-radius:12px;background:#eef7f1;font-weight:1000;color:#173020;width:74px;height:48px;font-size:15px}.n{top:10px;left:73px}.s{bottom:10px;left:73px}.o{left:10px;top:86px}.l{right:10px;top:86px}.player{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:48px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mini{background:#f3f8f5;border:2px solid #dce9df;border-radius:14px;padding:10px;text-align:center;font-weight:900}.mapbox{height:225px;background:#b9e5a5;border-radius:16px;position:relative;overflow:hidden;border:2px solid #d4e5d2}.roadH{position:absolute;left:0;right:0;top:95px;height:42px;background:#d8c49a}.roadV{position:absolute;top:0;bottom:0;left:46%;width:42px;background:#d8c49a}.pin{position:absolute;font-size:32px}.home{left:12%;top:28px}.school{right:9%;top:28px}.bakery{left:12%;bottom:22px}.stadium{right:9%;bottom:18px}.route{display:grid;grid-template-columns:repeat(4,52px);grid-template-rows:repeat(4,52px);gap:5px;justify-content:center;margin:10px 0}.cell{background:#eef7f1;border:2px solid #d9e7dc;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:27px}.pad{display:grid;grid-template-columns:repeat(3,62px);gap:6px;justify-content:center}.pad .btn{padding:8px;height:52px;font-size:22px}.blank{visibility:hidden}.flash{position:absolute;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;color:#fff;font-size:54px;font-weight:1000;text-shadow:0 5px 20px #0008;text-align:center}.flash.go{animation:pop .7s ease}@keyframes pop{0%{opacity:0;transform:scale(.6)}40%{opacity:1;transform:scale(1.05)}100%{opacity:0}}.note{background:#fff7d7;border-left:5px solid var(--y);padding:10px 11px;border-radius:12px;font-weight:850}@media (max-height:700px){.stage{align-items:flex-start}.field,.stage{min-height:auto}.card{margin:4px 0}.sunbox{height:150px}.compass{width:210px;height:210px}.n,.s{left:62px}.o,.l{top:74px}}
</style>
</head>
<body>
<div class="app"><div class="top"><div class="title">⚽ Geografia do Arthur</div><div class="pill" id="score">⭐ 0</div></div><div class="progress"><div id="bar"></div></div><div class="field"><div class="flash" id="flash"></div><div class="stage" id="stage"></div></div></div>
<script>
const stage=document.getElementById('stage'),bar=document.getElementById('bar'),scoreEl=document.getElementById('score'),flash=document.getElementById('flash');let step=0,score=0,routePos={r:3,c:0};function pop(t){flash.textContent=t;flash.className='flash';void flash.offsetWidth;flash.classList.add('go')}function progress(){bar.style.width=Math.min(100,(step/9)*100)+'%'}function next(){step++;render()}function home(){step=0;score=0;scoreEl.textContent='⭐ 0';bar.style.width='0%';stage.innerHTML=`<div class="card" style="text-align:center"><div class="big">🧤⚽🧭</div><h1>Treino do Arthur</h1><p class="sub"><b>Você vai aprender jogando.</b> Cada fase te faz descobrir a resposta antes de decorar.</p><button class="btn primary" onclick="step=1;render()">COMEÇAR ⚽</button></div>`}function render(){progress();if(step===1)sol(0);if(step===2)rosa();if(step===3)visoes(0);if(step===4)mapa();if(step===5)referencia(0);if(step===6)percurso();if(step===7)paisagem();if(step===8)quiz(0);if(step===9)fim()}function sol(s){const data=[["O Sol está NASCENDO. Qual palavra combina com isso?",["NASCENTE","POENTE"],0],["Agora o Sol está SE PONDO. Qual palavra combina?",["NASCENTE","POENTE"],1],["NASCENTE fica em qual ponto cardeal?",["LESTE","OESTE"],0],["POENTE fica em qual ponto cardeal?",["LESTE","OESTE"],1]],q=data[s];stage.innerHTML=`<div class="card"><div class="coach">🎯 ${q[0]}</div><div class="sunbox"><div class="sun">${s===1||s===3?'🌇':'🌞'}</div><div class="labelLR left">LESTE</div><div class="labelLR right">OESTE</div></div><div class="choices">${q[1].map((o,i)=>`<button class="btn choice" onclick="solHit(${s},${i})">${o}</button>`).join('')}</div><div id="fb" class="feedback"></div></div>`}function solHit(s,i){const goods=[0,1,0,1],txt=["NASCENTE é onde o Sol NASCE.","POENTE é onde o Sol SE PÕE.","NASCENTE = LESTE.","POENTE = OESTE."];let fb=document.getElementById('fb');if(i===goods[s]){pop('GOOOL! ⚽');fb.className='feedback show ok';fb.textContent=txt[s];setTimeout(()=>s<3?sol(s+1):next(),750)}else{fb.className='feedback show no';fb.innerHTML='Pensa na palavra: <b>NAScente = nasce</b> / <b>POente = se põe</b>. Tenta de novo.'}}function rosa(){stage.innerHTML=`<div class="card"><div class="coach">🧭 Arthur está no meio do campo. Toque nas direções que eu pedir.</div><div class="compass"><button class="dir n" onclick="dir('N')">NORTE</button><button class="dir s" onclick="dir('S')">SUL</button><button class="dir o" onclick="dir('O')">OESTE</button><button class="dir l" onclick="dir('L')">LESTE</button><div class="player">🧤</div></div><h2 id="prompt" style="text-align:center"></h2><div id="fb" class="feedback"></div></div>`;window.seq=['N','L','S','O'];window.di=0;upd()}function upd(){const n={N:'NORTE',S:'SUL',L:'LESTE',O:'OESTE'};document.getElementById('prompt').textContent='TOQUE EM: '+n[window.seq[window.di]]}function dir(x){let fb=document.getElementById('fb');if(x===window.seq[window.di]){pop('DEFENDEU! 🧤');fb.className='feedback show ok';fb.textContent='Boa!';window.di++;if(window.di===4)setTimeout(next,650);else setTimeout(upd,350)}else{fb.className='feedback show no';fb.textContent='Quase. Procura a palavra certa na rosa dos ventos.'}}function visoes(s){const arr=[["De frente","Frontal","👀🏠"],["Reto de cima","Vertical","⬇️🏠"],["De cima e inclinado","Oblíqua","↘️🏠"],["Pelo lado","Lateral","➡️🏠"]],q=arr[s];stage.innerHTML=`<div class="card"><div class="coach">👀 Imagine que Arthur está olhando uma casa <b>${q[0]}</b>. Que visão é?</div><div class="big">${q[2]}</div><div class="choices">${["Frontal","Lateral","Vertical","Oblíqua"].map(v=>`<button class="btn choice" onclick="viewHit(${s},'${v}')">${v}</button>`).join('')}</div><div id="fb" class="feedback"></div></div>`}function viewHit(s,v){const goods=["Frontal","Vertical","Oblíqua","Lateral"],exp={Frontal:"Frontal = de frente.",Lateral:"Lateral = de lado.",Vertical:"Vertical/superior = reto de cima.",Oblíqua:"Oblíqua = de cima e inclinada."};let fb=document.getElementById('fb');if(v===goods[s]){pop('GOOOL! ⚽');fb.className='feedback show ok';fb.textContent=exp[v];setTimeout(()=>s<3?visoes(s+1):next(),700)}else{fb.className='feedback show no';fb.textContent='Olha a posição da seta e tenta de novo.'}}function mapa(){stage.innerHTML=`<div class="card"><div class="coach">🗺️ Olha o mini mapa. Os desenhos representam lugares. Para que serve a LEGENDA?</div><div class="mapbox"><div class="roadH"></div><div class="roadV"></div><div class="pin home">🏠</div><div class="pin school">🏫</div><div class="pin bakery">🥖</div><div class="pin stadium">🏟️</div></div><div class="choices"><button class="btn choice" onclick="mapHit(1)">Explicar o significado dos símbolos</button><button class="btn choice" onclick="mapHit(0)">Mostrar a temperatura</button></div><div id="fb" class="feedback"></div></div>`}function mapHit(ok){let fb=document.getElementById('fb');if(ok){pop('GOOOL! ⚽');fb.className='feedback show ok';fb.innerHTML='Isso! A legenda é o <b>tradutor do mapa</b>.';setTimeout(next,800)}else{fb.className='feedback show no';fb.textContent='Não. A legenda ajuda a entender os símbolos do mapa.'}}function referencia(s){const arr=[["Sua casa fica ao lado da padaria. A padaria ajuda um amigo a encontrar sua casa. Ela é...",["Ponto de referência","Ponto cardeal"]],["Qual deixa o endereço mais exato?",["Rua + número","Só a cor da casa"]],["CEP significa...",["Código de Endereçamento Postal","Cartão Especial de Pessoas"]]],q=arr[s];stage.innerHTML=`<div class="card"><div class="coach">📍 ${q[0]}</div><div class="choices">${q[1].map((o,i)=>`<button class="btn choice" onclick="refHit(${s},${i})">${o}</button>`).join('')}</div><div id="fb" class="feedback"></div></div>`}function refHit(s,i){let fb=document.getElementById('fb');if(i===0){pop('DEFENDEU! 🧤');fb.className='feedback show ok';fb.textContent=s===0?'Lugar conhecido que ajuda a encontrar outro = ponto de referência.':s===1?'Rua e número deixam o endereço mais preciso.':'CEP = Código de Endereçamento Postal.';setTimeout(()=>s<2?referencia(s+1):next(),700)}else{fb.className='feedback show no';fb.textContent='Quase. Pensa no que ajuda alguém a encontrar o lugar.'}}function percurso(){routePos={r:3,c:0};stage.innerHTML=`<div class="card"><div class="coach">↪️ Leve o Arthur 🧤 até o estádio 🏟️. Isso é um PERCURSO: um caminho com direções.</div><div id="route" class="route"></div><div class="pad"><div class="blank"></div><button class="btn secondary" onclick="move(-1,0)">⬆️</button><div class="blank"></div><button class="btn secondary" onclick="move(0,-1)">⬅️</button><button class="btn secondary" onclick="move(1,0)">⬇️</button><button class="btn secondary" onclick="move(0,1)">➡️</button></div><div class="note" style="margin-top:10px">Percurso pode usar: <b>reto, direita e esquerda</b>.</div></div>`;draw()}function draw(){let g=document.getElementById('route');if(!g)return;g.innerHTML='';for(let r=0;r<4;r++)for(let c=0;c<4;c++){let t='';if(r===0&&c===3)t='🏟️';if((r===1&&c===1)||(r===2&&c===2))t='🚧';if(r===routePos.r&&c===routePos.c)t='🧤';let d=document.createElement('div');d.className='cell';d.textContent=t;g.appendChild(d)}}function move(dr,dc){let nr=routePos.r+dr,nc=routePos.c+dc;if(nr<0||nr>3||nc<0||nc>3)return;if((nr===1&&nc===1)||(nr===2&&nc===2)){pop('DESVIO! 🚧');return}routePos={r:nr,c:nc};draw();if(nr===0&&nc===3){pop('CHEGOU! 🏟️');setTimeout(next,900)}}function paisagem(){stage.innerHTML=`<div class="card"><div class="coach">🌳 Paisagem é tudo que podemos observar em um espaço. Quais desses podem fazer parte de uma paisagem?</div><div class="grid2"><div class="mini">🌳<br>Árvore</div><div class="mini">🏠<br>Casa</div><div class="mini">⛰️<br>Montanha</div><div class="mini">🛣️<br>Rua</div></div><div class="choices"><button class="btn choice" onclick="land(1)">TODOS ELES</button><button class="btn choice" onclick="land(0)">SÓ ÁRVORE E MONTANHA</button></div><div id="fb" class="feedback"></div></div>`}function land(ok){let fb=document.getElementById('fb');if(ok){pop('GOOOL! ⚽');fb.className='feedback show ok';fb.textContent='Isso! Paisagem pode ter natureza e coisas construídas pelas pessoas.';setTimeout(next,800)}else{fb.className='feedback show no';fb.textContent='Paisagem não é só natureza. Casas e ruas também fazem parte.'}}const Q=[["Nascente = ?",["Leste","Oeste"],0],["Poente = ?",["Leste","Oeste"],1],["Sol se põe no...",["Oeste","Leste"],0],["Reto de cima = visão...",["Vertical","Frontal"],0],["De cima e inclinado = visão...",["Oblíqua","Lateral"],0],["Legenda serve para...",["Explicar símbolos","Medir temperatura"],0],["Padaria usada para encontrar a casa = ...",["Ponto de referência","Ponto cardeal"],0],["'Siga reto e vire à direita' descreve...",["Percurso","Legenda"],0]];function quiz(i){if(i>=Q.length){step=9;render();return}let q=Q[i];bar.style.width=(78+i/Q.length*20)+'%';stage.innerHTML=`<div class="card"><div class="coach">🏆 FINAL ${i+1}/${Q.length}</div><h2>${q[0]}</h2><div class="choices">${q[1].map((o,j)=>`<button class="btn choice" onclick="quizHit(${i},${j})">${o}</button>`).join('')}</div><div id="fb" class="feedback"></div></div>`}function quizHit(i,j){let fb=document.getElementById('fb');if(j===Q[i][2]){score++;scoreEl.textContent='⭐ '+score;pop('GOOOL! ⚽');fb.className='feedback show ok';fb.textContent='Certo!'}else{fb.className='feedback show no';fb.textContent='Quase. A resposta certa ficou marcada na sua cabeça agora.'}setTimeout(()=>quiz(i+1),650)}function fim(){bar.style.width='100%';stage.innerHTML=`<div class="card" style="text-align:center"><div class="big">🏆</div><h1>Fim de jogo!</h1><div style="font-size:68px;font-weight:1000;color:#0f7a39">${score}/${Q.length}</div><div class="note" style="text-align:left;margin:12px 0">🌞 Nascente = Leste = Sol nasce<br>🌇 Poente = Oeste = Sol se põe<br>🧭 Norte, Sul, Leste e Oeste<br>👀 Frontal / lateral / vertical / oblíqua<br>🗺️ Legenda explica os símbolos</div><button class="btn primary" onclick="home()">JOGAR DE NOVO ⚽</button></div>`}home();
</script></body></html>
